name: Build and Release Droid DDK

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Generate matrix from mapping.json
        id: gen
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('mapping.json', 'utf8');
            const data = JSON.parse(raw);
            const matrix = (data.matrix || [])
              .filter(m => (m.platforms || []).includes('linux-amd64'))
              .map(m => ({
                source_name: m.android,
                clang_name: m.clang,
              }));
            core.setOutput('matrix', JSON.stringify(matrix));
  
  toolchains:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - name: Checkout code
      uses: actions/checkout@v4
      with:
          submodules: false

    - name: Pull LFS
      run: |
        GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive --depth 1
        git -C prebuilts lfs pull --include="rust/**"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      run: |
        make -C docker builder PUSH=1
        make -C docker toolchains PUSH=1
  
  build:
    needs: ["prepare", "toolchains"]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Checkout code
      uses: actions/checkout@v4
      with:
          lfs: false

    - name: Pull LFS
      run: |
        GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --recursive --depth 1
        git -C prebuilts lfs pull --include="src/src.${{ matrix.source_name }}.tar.zst"
        git -C prebuilts lfs pull --include="kdir/linux-amd64/kdir.${{ matrix.source_name }}.tar.zst"
        ls -al prebuilts/src/
        ls -al prebuilts/kdir/linux-amd64/

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      run: |
        make -C docker build VER=${{ matrix.source_name }} PUSH=1
