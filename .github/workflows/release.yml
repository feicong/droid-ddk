name: Build and Release Droid DDK

on:
  workflow_dispatch:
    inputs:
      target:
        description: 可选；只构建 mapping.json 中的一个 Android 目标
        required: false
        default: ""
        type: string

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: false
      - name: Generate matrix from mapping.json
        id: gen
        uses: actions/github-script@v7
        env:
          TARGET: ${{ inputs.target }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('mapping.json', 'utf8');
            const data = JSON.parse(raw);
            const requestedTarget = process.env.TARGET.trim();
            const matrix = (data.matrix || [])
              .filter(m => (m.platforms || []).includes('linux-amd64'))
              .filter(m => !requestedTarget || m.android === requestedTarget)
              .map(m => ({
                source_name: m.android,
                clang_name: m.clang,
              }));
            if (requestedTarget && matrix.length === 0) {
              core.setFailed(`linux-amd64 does not support target: ${requestedTarget}`);
              return;
            }
            core.setOutput('matrix', JSON.stringify(matrix));
  
  builder:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - name: Checkout code
      uses: actions/checkout@v6
      with:
          submodules: false
          lfs: false

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      run: |
        make -C docker builder PUSH=1

  toolchains:
    needs: [prepare, builder]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
    - name: Checkout code
      uses: actions/checkout@v6
      with:
          submodules: false
          lfs: false

    - name: Download toolchain prebuilts
      run: |
        build/fetch-prebuilts.sh \
          --host-platform linux-amd64 \
          --target-rust "${{ matrix.source_name }}"

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      run: |
        make -C docker toolchains \
          VER="${{ matrix.source_name }}" \
          TAG_SUFFIX=-linux-amd64 \
          PUSH=1

    - name: Publish multi-platform image
      run: |
        image="docker.io/fsx199/droid-ddk-toolchain:${{ matrix.source_name }}"
        docker buildx imagetools create \
          --tag "$image" \
          "${image}-linux-arm64" \
          "${image}-linux-amd64"
        docker buildx imagetools inspect --raw "$image" | \
          jq -e '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | index("arm64")) and ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | index("amd64"))'
  
  build:
    needs: ["prepare", "toolchains"]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Checkout code
      uses: actions/checkout@v6
      with:
          submodules: false
          lfs: false

    - name: Download kernel prebuilts
      run: |
        build/fetch-prebuilts.sh \
          --host-platform linux-amd64 \
          --target "${{ matrix.source_name }}"
        ls -al prebuilts/src/
        ls -al prebuilts/kdir/linux-amd64/

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build image
      run: |
        make -C docker build \
          VER=${{ matrix.source_name }} \
          TAG_SUFFIX=-linux-amd64 \
          PUSH=1

    - name: Publish multi-platform image
      run: |
        image="docker.io/fsx199/droid-ddk:${{ matrix.source_name }}"
        docker buildx imagetools create \
          --tag "$image" \
          "${image}-linux-arm64" \
          "${image}-linux-amd64"
        docker buildx imagetools inspect --raw "$image" | \
          jq -e '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | index("arm64")) and ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | index("amd64"))'
