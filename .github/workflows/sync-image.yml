name: sync-image

on:
  workflow_dispatch:
    inputs:
      date:
        description: "可选：附加版本日期（例如 20251016），将额外同步 tag-<date>"
        required: false
        default: ""

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      toolchain-matrix: ${{ steps.generate.outputs.toolchain_matrix }}
      image-matrix: ${{ steps.generate.outputs.image_matrix }}
      has_ghcr: ${{ steps.check.outputs.has_ghcr }}
      has_docker: ${{ steps.check.outputs.has_docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check available credentials
        id: check
        env:
          HAS_GHCR: ${{ secrets.GHCR_TOKEN != '' }}
          HAS_DOCKER: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "has_ghcr=$HAS_GHCR" >> "$GITHUB_OUTPUT"
          echo "has_docker=$HAS_DOCKER" >> "$GITHUB_OUTPUT"
          echo "GHCR: $HAS_GHCR, Docker Hub: $HAS_DOCKER"

      - name: Generate matrix
        id: generate
        run: |
          toolchain_matrix=$(jq -c '{include:
            ([.matrix[] | select((.platforms // []) | length > 0) | .android] |
             unique | map({project: "droid-ddk-toolchain", tag: .}))
          }' mapping.json)
          image_matrix=$(jq -c '{include:
            ([.matrix[] | select((.platforms // []) | length > 0) | .android] | unique) as $targets |
            ([$targets[] | {project: "droid-ddk", tag: .}] +
             [$targets[] | {project: "droid-ddk-min", tag: .}])
          }' mapping.json)
          echo "toolchain_matrix=$toolchain_matrix" >> "$GITHUB_OUTPUT"
          echo "image_matrix=$image_matrix" >> "$GITHUB_OUTPUT"
          echo "Toolchain matrix: $toolchain_matrix"
          echo "Image matrix: $image_matrix"

  sync-toolchain:
    name: toolchain:${{ matrix.tag }}
    needs: prepare
    if: needs.prepare.outputs.has_ghcr == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.toolchain-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Login to Docker Hub
        if: needs.prepare.outputs.has_docker == 'true'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_PASS" | skopeo login docker.io --username "$DOCKERHUB_USER" --password-stdin

      - name: Sync Docker Hub to GitHub
        run: |
          build/sync-image.sh -s docker -d github -p ${{ matrix.project }} -t ${{ matrix.tag }}
          if [ -n '${{ github.event.inputs.date }}' ]; then
            build/sync-image.sh -s docker -d github -p ${{ matrix.project }} -t ${{ matrix.tag }} --new-date '${{ github.event.inputs.date }}'
          fi

      - name: Sync GitHub to Docker Hub
        if: needs.prepare.outputs.has_docker == 'true'
        run: |
          build/sync-image.sh -s github -d docker -p ${{ matrix.project }} -t ${{ matrix.tag }}
          if [ -n '${{ github.event.inputs.date }}' ]; then
            build/sync-image.sh -s github -d docker -p ${{ matrix.project }} -t ${{ matrix.tag }} --new-date '${{ github.event.inputs.date }}'
          fi

  sync-image:
    name: ${{ matrix.project }}:${{ matrix.tag }}
    needs: [prepare, sync-toolchain]
    if: needs.prepare.outputs.has_ghcr == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.image-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Login to Docker Hub
        if: needs.prepare.outputs.has_docker == 'true'
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_PASS" | skopeo login docker.io --username "$DOCKERHUB_USER" --password-stdin

      - name: Sync Docker Hub to GitHub
        run: |
          build/sync-image.sh -s docker -d github -p ${{ matrix.project }} -t ${{ matrix.tag }}
          if [ -n '${{ github.event.inputs.date }}' ]; then
            build/sync-image.sh -s docker -d github -p ${{ matrix.project }} -t ${{ matrix.tag }} --new-date '${{ github.event.inputs.date }}'
          fi

      - name: Sync GitHub to Docker Hub
        if: needs.prepare.outputs.has_docker == 'true'
        run: |
          build/sync-image.sh -s github -d docker -p ${{ matrix.project }} -t ${{ matrix.tag }}
          if [ -n '${{ github.event.inputs.date }}' ]; then
            build/sync-image.sh -s github -d docker -p ${{ matrix.project }} -t ${{ matrix.tag }} --new-date '${{ github.event.inputs.date }}'
          fi
